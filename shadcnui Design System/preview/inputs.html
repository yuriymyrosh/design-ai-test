<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); }
  .wrap { padding: 26px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 14px; font-weight: 500; color: var(--foreground); }
  .input { height: 40px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--input);
           font-size: 14px; color: var(--foreground); background: var(--background); }
  .input::placeholder { color: var(--muted-foreground); }
  .input.focus { outline: 2px solid var(--ring); outline-offset: 2px; }
  .help { font-size: 14px; color: var(--muted-foreground); }
  .row { display: flex; gap: 8px; }
  .btn { height: 40px; padding: 0 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500;
         background: var(--primary); color: var(--primary-foreground); border: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="field">
    <label>Email</label>
    <input class="input" placeholder="Email">
    <span class="help">Enter your email address.</span>
  </div>
  <div class="field">
    <label>Username</label>
    <input class="input focus" value="shadcn">
    <span class="help">Focus ring — 2px slate-900, 2px offset.</span>
  </div>
  <div class="field">
    <label>Subscribe</label>
    <div class="row">
      <input class="input" style="flex:1" placeholder="Email">
      <button class="btn">Subscribe</button>
    </div>
  </div>
  <div class="field">
    <label>Disabled</label>
    <input class="input" placeholder="Email" disabled style="opacity:.5;cursor:not-allowed;background:var(--muted)">
    <span class="help">50% opacity, not-allowed.</span>
  </div>
</div>
</body>
</html>
