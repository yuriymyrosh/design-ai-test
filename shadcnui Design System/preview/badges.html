<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); }
  .wrap { padding: 30px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: var(--radius-md);
           font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  .default { background: var(--primary); color: var(--primary-foreground); }
  .secondary { background: var(--secondary); color: var(--secondary-foreground); }
  .destructive { background: var(--destructive); color: var(--destructive-foreground); }
  .outline { background: transparent; color: var(--foreground); border-color: var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge default">Badge</span>
  <span class="badge secondary">Secondary</span>
  <span class="badge destructive">Destructive</span>
  <span class="badge outline">Outline</span>
</div>
</body>
</html>
