<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); }
  .wrap { padding: 28px 32px; display: flex; gap: 56px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .ttl { font-size: 11px; font-family: var(--font-mono); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--foreground); }
  /* switch */
  .sw { width: 44px; height: 24px; border-radius: 9999px; position: relative; flex-shrink: 0; }
  .sw .knob { position: absolute; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); }
  .sw.off { background: var(--input); }
  .sw.off .knob { left: 2px; }
  .sw.on { background: var(--primary); }
  .sw.on .knob { left: 22px; }
  /* checkbox */
  .cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cb.on { background: var(--primary); color: var(--primary-foreground); }
  .cb svg { width: 12px; height: 12px; }
  /* radio */
  .rd { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rd .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <span class="ttl">Switch</span>
    <div class="row"><span class="sw on"><span class="knob"></span></span>Airplane mode</div>
    <div class="row"><span class="sw off"><span class="knob"></span></span>Wi-Fi</div>
  </div>
  <div class="col">
    <span class="ttl">Checkbox</span>
    <div class="row"><span class="cb on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>Accept terms</div>
    <div class="row"><span class="cb"></span>Send me updates</div>
  </div>
  <div class="col">
    <span class="ttl">Radio</span>
    <div class="row"><span class="rd"><span class="dot"></span></span>Default</div>
    <div class="row"><span class="rd"></span>Comfortable</div>
  </div>
</div>
</body>
</html>
