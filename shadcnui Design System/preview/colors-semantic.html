<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); }
  .wrap { padding: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .tok { display: flex; align-items: center; gap: 10px; }
  .chip { width: 40px; height: 40px; border-radius: var(--radius-md); border: 1px solid rgb(0 0 0 / 0.08); flex-shrink: 0; }
  .meta { display: flex; flex-direction: column; min-width: 0; }
  .name { font-size: 12px; font-weight: 600; color: var(--foreground); }
  .hex { font-size: 11px; color: var(--muted-foreground); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tok"><div class="chip" style="background:var(--primary)"></div><div class="meta"><span class="name">primary</span><span class="hex">#0f172a</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--secondary)"></div><div class="meta"><span class="name">secondary</span><span class="hex">#f1f5f9</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--muted)"></div><div class="meta"><span class="name">muted</span><span class="hex">#f1f5f9</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--background);border:1px solid var(--border)"></div><div class="meta"><span class="name">background</span><span class="hex">#ffffff</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--foreground)"></div><div class="meta"><span class="name">foreground</span><span class="hex">#020817</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--muted-foreground)"></div><div class="meta"><span class="name">muted-fg</span><span class="hex">#64748b</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--border)"></div><div class="meta"><span class="name">border</span><span class="hex">#e2e8f0</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--input)"></div><div class="meta"><span class="name">input</span><span class="hex">#cbd5e1</span></div></div>
  <div class="tok"><div class="chip" style="background:var(--destructive)"></div><div class="meta"><span class="name">destructive</span><span class="hex">#ef4444</span></div></div>
</div>
</body>
</html>
