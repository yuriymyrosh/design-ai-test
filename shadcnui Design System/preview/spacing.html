<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); }
  .wrap { padding: 24px 32px; display: flex; flex-direction: column; gap: 12px; }
  .item { display: flex; align-items: center; gap: 14px; }
  .bar { height: 16px; background: var(--primary); border-radius: 2px; }
  .lbl { font-size: 11px; font-family: var(--font-mono); color: var(--muted-foreground); width: 96px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><span class="lbl">1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="item"><span class="lbl">1.5 · 6px</span><div class="bar" style="width:6px"></div></div>
  <div class="item"><span class="lbl">2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="item"><span class="lbl">3 · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="item"><span class="lbl">4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="item"><span class="lbl">6 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="item"><span class="lbl">8 · 32px</span><div class="bar" style="width:32px"></div></div>
</div>
</body>
</html>
