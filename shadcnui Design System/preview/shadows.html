<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--background); }
  .wrap { padding: 32px 24px; display: flex; gap: 28px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 110px; height: 64px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .name { font-size: 12px; font-weight: 600; color: var(--foreground); }
  .val { font-size: 11px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="name">sm</span><span class="val">cards</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow)"></div><span class="name">base</span><span class="val">raised</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="name">md</span><span class="val">dropdown</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="name">lg</span><span class="val">dialog</span></div>
</div>
</body>
</html>
